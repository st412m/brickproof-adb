name: mcpb

# Builds the Claude Desktop extension brickproof-adb-<version>.mcpb from the
# release's own sources and attaches it to the GitHub release.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  mcpb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${v}" >&2
            exit 1
          fi
      - name: Pack
        run: |
          npm pack --ignore-scripts
          node tools/pack-mcpb.mjs "brickproof-adb-$(node -p "require('./package.json').version").tgz" .
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "brickproof-adb-$(node -p "require('./package.json').version").mcpb" --clobber
